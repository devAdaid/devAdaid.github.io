<!-- index.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>adaid</title>
<script>
document.write(`<link rel="stylesheet" href="css/style.css?v=${Date.now()}">`);
</script>
<noscript><link rel="stylesheet" href="css/style.css"></noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
</head>
<body>

<nav>
  <a href="index.html" class="brand">ADAID</a>
  <div class="nav-right">
    <button class="share-btn" data-i18n="share" onclick="openQR()">공유</button>
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">日</button>
    </div>
  </div>
</nav>

<div class="qr-overlay" id="qr-overlay" onclick="closeQR()">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <button class="qr-close" onclick="closeQR()">✕</button>
    <img src="QR.jpg" alt="QR 코드">
  </div>
</div>

<main class="container">

<section class="hero">

  <img class="avatar"
       src="profile.png"
       alt="프로필 사진"
       onerror="this.style.display='none'">

  <h1 data-i18n="hero_name">어데이드</h1>

  <p class="tagline" data-i18n="hero_tagline">
    <b>'게임'</b>을 통해 인상적인 경험을 <b>'당신'</b>에게.<br>
    만들고 싶은 게임을 만듭니다.
  </p>

  <div class="socials">

    <a href="https://x.com/indie_adaid" target="_blank">
      <img src="icons/x.png" alt="">
      <span data-i18n="social_x">X (트위터)</span>
    </a>

    <a href="https://adaid.itch.io/" target="_blank">
      <img src="icons/itchio.svg" alt="">
      itch.io
    </a>

    <a href="https://www.postype.com/@indie-adaid" target="_blank">
      <img src="icons/postype.png" alt="">
      <span data-i18n="social_postype">포스타입</span>
    </a>

    <a href="https://www.game-ping.kr/users/어데이드" target="_blank">
      <img src="icons/gameping.png" alt="">
      <span data-i18n="social_gameping">게임핑</span>
    </a>

    <a href="https://www.youtube.com/@어데이드" target="_blank">
      <img src="icons/youtube.png" alt="">
      YouTube
    </a>

    <a href="https://adaid.notion.site/About-29784d0908ea802b823dc92c72b74e0b" target="_blank">
      <img src="icons/notion.svg" alt="" style="filter:brightness(0) invert(1);">
      <span data-i18n="social_notion">노션</span>
    </a>

  </div>

</section>

<section id="games">

  <p class="section-title" data-i18n="section_games">Games</p>

  <div class="platform-filter-row">
    <div class="platform-filter" id="platform-filter" aria-label="Platform filter"></div>
    <p class="platform-filter-note" data-i18n="web_play_note">* 웹 플레이는 다운로드 없이 플레이 가능합니다.</p>
  </div>

  <div class="games-grid" id="games-grid">
    <p class="status" data-i18n="loading">불러오는 중...</p>
  </div>

</section>

<p class="footer" data-i18n="footer">© 2026 adaid Portfolio</p>

</main>

<script>
const SUPPORTED_LANGS = ['ko', 'en', 'ja'];
const LANG_FLAGS = { ko:'kr', en:'us', ja:'jp', zh:'cn', fr:'fr', de:'de', es:'es' };
const ENGINE_LABELS = {
  unity: 'Unity',
  rpgmakermz: 'RPG Maker MZ',
  renpy: 'Ren\'Py'
};
const PLATFORM_META = {
  computer_web: {
    icon: 'icons/computer_web.png',
    label: { ko: '웹 PC', en: 'Web PC', ja: 'PC Web' }
  },
  mobile_web: {
    icon: 'icons/mobile_web.png',
    label: { ko: '웹 모바일', en: 'Web Mobile', ja: 'モバイルWeb' }
  },
  windows: {
    icon: 'icons/windows.png',
    label: { ko: '윈도우', en: 'Windows', ja: 'Windows' }
  }
};
const PLATFORM_ORDER = ['computer_web', 'mobile_web', 'windows'];
const PLATFORM_ALL_LABELS = { ko: '전체', en: 'All', ja: 'すべて' };
const CACHE_BUST = Date.now();

let currentLang = 'ko';
let strings = {};
let selectedPlatform = 'all';

function freshUrl(path) {
  return `${path}${path.includes('?') ? '&' : '?'}v=${CACHE_BUST}`;
}

function fetchFresh(path) {
  return fetch(freshUrl(path), { cache: 'no-store' });
}

function bustStaticImages() {
  document.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src');
    if (!src || src.includes('?v=') || src.startsWith('http') || src.startsWith('data:')) return;
    img.src = freshUrl(src);
  });
}

function detectLang() {
  const saved = localStorage.getItem('lang');
  if (saved && SUPPORTED_LANGS.includes(saved)) return saved;
  const browser = navigator.language.slice(0, 2);
  return SUPPORTED_LANGS.includes(browser) ? browser : 'ko';
}

async function changeLang(lang) {
  const res = await fetchFresh(`lang/${lang}.json`);
  strings = await res.json();
  currentLang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  applyStrings();
  loadGames();
}

function applyStrings() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (strings[key] !== undefined) el.innerHTML = strings[key];
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
}

function loc(game, field) {
  return game[`${field}_${currentLang}`] || game[field] || '';
}

function platformLabel(platform) {
  return PLATFORM_META[platform]?.label?.[currentLang] || PLATFORM_META[platform]?.label?.en || platform;
}

function platformAllLabel() {
  return PLATFORM_ALL_LABELS[currentLang] || PLATFORM_ALL_LABELS.en;
}

function availablePlatforms(games) {
  const used = new Set(games.flatMap(g => g.platforms || []));
  return PLATFORM_ORDER.filter(platform => used.has(platform) && PLATFORM_META[platform]);
}

function renderPlatformFilter(games) {
  const filter = document.getElementById('platform-filter');
  const platforms = availablePlatforms(games);

  if (!platforms.length) {
    filter.innerHTML = '';
    filter.hidden = true;
    selectedPlatform = 'all';
    return;
  }

  filter.hidden = false;
  if (selectedPlatform !== 'all' && !platforms.includes(selectedPlatform)) {
    selectedPlatform = 'all';
  }

  filter.innerHTML = `
    <button class="platform-filter-btn${selectedPlatform === 'all' ? ' active' : ''}"
            type="button"
            data-platform="all"
            aria-pressed="${selectedPlatform === 'all'}">
      ${platformAllLabel()}
    </button>
    ${platforms.map(p => `
      <button class="platform-filter-btn${selectedPlatform === p ? ' active' : ''}"
              type="button"
              data-platform="${p}"
              title="${platformLabel(p)}"
              aria-label="${platformLabel(p)}"
              aria-pressed="${selectedPlatform === p}">
        <img src="${freshUrl(PLATFORM_META[p].icon)}" alt="" loading="lazy">
        <span>${platformLabel(p)}</span>
      </button>
    `).join('')}
  `;
}

function renderGameCards(games) {
  const grid = document.getElementById('games-grid');
  const filteredGames = selectedPlatform === 'all'
    ? games
    : games.filter(g => g.platforms?.includes(selectedPlatform));

  if (!filteredGames.length) {
    grid.innerHTML = `<p class="status">${strings.no_games || ''}</p>`;
    return;
  }

  grid.innerHTML = filteredGames.map(g => `
    <a class="game-card"
       href="game.html?id=${encodeURIComponent(g.id)}">

      <div class="card-thumb-wrap">
        ${g.thumbnail
          ? `<img class="card-thumb"
                 src="${freshUrl(g.thumbnail)}"
                 alt="${loc(g, 'title')}"
                 loading="lazy">`
          : `<div class="card-thumb-placeholder">No Image</div>`
        }
        ${g.award ? `<img class="card-award" src="${freshUrl('icons/award.svg')}" alt="award">` : ''}
        ${g.engine ? `<img class="card-engine" src="${freshUrl(`icons/${g.engine}.png`)}" alt="${ENGINE_LABELS[g.engine] || g.engine}" title="${ENGINE_LABELS[g.engine] || g.engine}" loading="lazy">` : ''}
      </div>

      <div class="card-body">
        <p class="card-title">${loc(g, 'title')}</p>

        ${loc(g, 'description')
          ? `<div class="card-tags">${loc(g, 'description').split(',').map(t => `<span class="card-tag">${t.trim()}</span>`).join('')}</div>`
          : ''
        }

        ${loc(g, 'tagline')
          ? `<p class="card-tagline">${loc(g, 'tagline')}</p>`
          : ''
        }

        ${g.platforms?.length || g.languages?.length
          ? `<div class="card-meta">
              ${g.platforms?.length
                ? `<div class="card-platforms">
                    ${g.platforms.map(p => PLATFORM_META[p]
                      ? `<span class="card-platform" title="${platformLabel(p)}" aria-label="${platformLabel(p)}">
                          <img src="${freshUrl(PLATFORM_META[p].icon)}" alt="" loading="lazy">
                        </span>`
                      : ''
                    ).join('')}
                  </div>`
                : '<span></span>'
              }
              ${g.languages?.length
                ? `<p class="card-langs">${g.languages.map(l => `<span class="fi fi-${LANG_FLAGS[l] ?? l}" title="${l}"></span>`).join('')}</p>`
                : ''
              }
            </div>`
          : ''
        }
      </div>

    </a>
  `).join('');

  document.querySelectorAll('.game-card').forEach((card, i) => {
    card.style.animationDelay = `${i * 0.08}s`;
    card.classList.add('show');
  });
}

async function loadGames() {
  const grid = document.getElementById('games-grid');
  grid.innerHTML = `<p class="status">${strings.loading || '...'}</p>`;

  try {
    const res = await fetchFresh('games.json');
    if (!res.ok) throw new Error();

    const games = await res.json();

    if (!games.length) {
      grid.innerHTML = `<p class="status">${strings.no_games || ''}</p>`;
      return;
    }

    renderPlatformFilter(games);
    renderGameCards(games);

  } catch(e) {
    grid.innerHTML = `<p class="status">${strings.load_error || 'Error'}</p>`;
  }
}

document.getElementById('platform-filter').addEventListener('click', e => {
  const btn = e.target.closest('.platform-filter-btn');
  if (!btn) return;
  selectedPlatform = btn.dataset.platform;
  loadGames();
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => changeLang(btn.dataset.lang));
});

bustStaticImages();
changeLang(detectLang());

function openQR(){
  document.getElementById('qr-overlay').classList.add('active');
}
function closeQR(){
  document.getElementById('qr-overlay').classList.remove('active');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeQR(); });
</script>

</body>
</html>
